<!-- 建議將上面範例中的 <head> 結構複製過來 -->
<div class="container mt-4">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <h3 class="mb-4 fw-bold">資產結構分析</h3>
    <div class="row align-items-center">
        <div class="col-md-5">
            <canvas id="typeChart"></canvas>
        </div>
        <div class="col-md-7">
            <div class="card p-3">
                <table class="table table-borderless">
                    <thead><tr class="text-muted small"><th>分類</th><th>數量</th><th>估值</th></tr></thead>
                    <tbody>
                        <tr><td><span class="badge bg-primary">●</span> 一般卡牌</td><td>45 張</td><td>$1,200</td></tr>
                        <tr><td><span class="badge bg-info">●</span> 特殊卡牌</td><td>8 件</td><td>$2,500</td></tr>
                        <tr><td><span class="badge bg-secondary">●</span> 其他收藏</td><td>12 件</td><td>$300</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const ctxAnalytic = document.getElementById('typeChart').getContext('2d');
    new Chart(ctxAnalytic, {
        type: 'doughnut',
        data: {
            labels: ['一般卡牌', '特殊卡牌', '其他'],
            datasets: [{
                data: [1200, 2500, 300],
                backgroundColor: ['#667eea', '#764ba2', '#adb5bd'],
                hoverOffset: 10
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });
</script>
