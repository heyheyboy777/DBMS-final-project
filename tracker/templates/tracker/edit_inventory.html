{% extends 'tracker/base.html' %}

{% block page_title %}Edit Collectible{% endblock %}

{% block extra_css %}
<style>
    .confirm-container {
        max-width: 600px;
        margin: 0 auto;
    }
    .product-preview {
        display: flex;
        gap: 24px;
        margin-bottom: 32px;
        align-items: center;
        background: #f9fafb;
        padding: 24px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }
    .product-image {
        width: 120px;
        height: 120px;
        object-fit: contain;
        background: white;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }
    .product-details h3 {
        margin-bottom: 8px;
        font-size: 18px;
        color: var(--text-main);
    }
    .product-details p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 4px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
        color: var(--text-main);
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        border-color: var(--sidebar-active);
    }
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
        resize: vertical;
    }
    .button-group {
        display: flex;
        gap: 16px;
        margin-top: 32px;
    }
    .btn-secondary {
        background-color: white;
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: background 0.2s;
        text-align: center;
    }
    .btn-secondary:hover {
        background-color: #f3f4f6;
    }
    .btn-danger {
        background-color: #ef4444;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn-danger:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}

{% block content %}
<div class="confirm-container">
    <div class="card">
        <div class="product-preview">
            {% if image_url %}
                <img src="{{ image_url }}" alt="{{ name }}" class="product-image">
            {% else %}
                <div class="product-image" style="background:#eee;"></div>
            {% endif %}
            
            <div class="product-details">
                <h3>{{ name }}</h3>
                <p>Platform: <strong>{{ platform }}</strong></p>
                <p>Category: <strong>{{ category }}</strong></p>
            </div>
        </div>

        <form method="POST" action="{% url 'edit_inventory' product_id %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="{{ quantity }}" min="1" required>
            </div>

            <div class="form-group">
                <label for="purchase_price">Average Purchase Price ($)</label>
                <input type="number" id="purchase_price" name="purchase_price" value="{{ purchase_price }}" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="content">Notes</label>
                <textarea id="content" name="content" rows="3" placeholder="e.g. Bought at Comic Con, mint condition, PSA graded...">{{ content }}</textarea>
            </div>

            <div class="button-group" style="justify-content: space-between;">
                <button type="submit" name="action" value="delete" class="btn-danger" onclick="return confirm('確定要從收藏清單中刪除此商品嗎？');">Delete Item</button>
                
                <div style="display: flex; gap: 16px;">
                    <a href="{% url 'index' %}" class="btn-secondary">Cancel</a>
                    <button type="submit" name="action" value="save" class="btn-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
