<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料</title>
</head>
<body>
    <h1>個人資料</h1>
    <nav>
        <a href="{% url 'index' %}">回到主畫面</a>
        <a href="{% url 'logout' %}">登出</a>
    </nav>

    {% if edit_mode %}
        <h2>編輯個人資料</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">更新</button>
            <a href="{% url 'profile' %}">取消</a>
        </form>
    {% else %}
        <h2>您的資訊</h2>
        <p><strong>姓名：</strong> {{ user.first_name }} {{ user.last_name }}</p>
        <p><strong>用戶名：</strong> {{ user.username }}</p>
        <a href="{% url 'profile' %}?edit=1">
            <button type="button">更改姓名和密碼</button>
        </a>
    {% endif %}

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
