<!-- 使用同上的頭部結構 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold">投資報酬率排行榜 (ROI)</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>項目名稱</th>
                        <th>購入價</th>
                        <th>市價</th>
                        <th>淨利</th>
                        <th>ROI</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>金卡</td>
                        <td>$2,000</td>
                        <td>$2,800</td>
                        <td class="text-success">+$800</td>
                        <td><span class="badge rounded-pill bg-success-subtle text-success">+40.0%</span></td>
                    </tr>
                    <tr>
                        <td> 銀卡</td>
                        <td>$200</td>
                        <td>$180</td>
                        <td class="text-danger">-$20</td>
                        <td><span class="badge rounded-pill bg-danger-subtle text-danger">-10.0%</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
